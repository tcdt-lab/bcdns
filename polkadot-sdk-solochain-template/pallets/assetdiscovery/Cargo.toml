[package]
name = "pallet-assetdiscovery"
description = "Custom runtime logic for the TLD networks in BCDNS."
version = "0.1.0"
license = "MIT-0"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
publish = false

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { features = [
    "derive",
], workspace = true }
scale-info = { features = [
    "derive",
], workspace = true }
pallet-rootdns = { workspace = true, default-features = false }
pallet-tld = { workspace = true, default-features = false }
hex-literal = { version = "0.4.1", default-features = false }
hex = { version = "0.4.3", default-features = false }
serde = { version = "1.0.130", default-features = false, features = ["derive"] }
serde_json = { default-features = false, workspace = true }
log = { version = "0.4.22", default-features = false }

# frame deps
frame-benchmarking = { optional = true, workspace = true }
frame-support.workspace = true
frame-system.workspace = true
sp-core = { default-features = false, workspace = true }
sp-runtime = { default-features = false, workspace = true }
sp-io = { default-features = false, workspace = true }

[features]
default = ["std"]
std = [
	"codec/std",
	"frame-benchmarking?/std",
	"frame-support/std",
	"frame-system/std",
	"log/std",
	"scale-info/std",
	"sp-core/std",
	"sp-io/std",
	"sp-runtime/std",
]
runtime-benchmarks = [
    "frame-benchmarking/runtime-benchmarks",
    "frame-support/runtime-benchmarks",
    "frame-system/runtime-benchmarks",
    "sp-runtime/runtime-benchmarks",
]
try-runtime = [
    "frame-support/try-runtime",
    "frame-system/try-runtime",
    "sp-runtime/try-runtime",
]